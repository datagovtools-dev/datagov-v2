version: "3.9"
# ── LOCAL DEVELOPMENT — no SSL, direct ports, hot-reload ─────────────────────
# Usage: docker compose -f docker-compose.dev.yml up
# Database: SQLite file in the sqlite_data volume, seeded from backend/datagov.db

networks:
  internal:
    driver: bridge

volumes:
  sqlite_data:
  redis_data:
  ollama_data:

services:

  # ── Frontend (Next.js dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ag_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file: .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    networks: [internal]
    restart: unless-stopped

  # ── Backend API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ag_api_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    env_file: .env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:////data/datagov.db
      - DATABASE_URL_SYNC=sqlite:////data/datagov.db
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    command: >
      sh -c "[ -f /data/datagov.db ] || cp /app/datagov.db /data/datagov.db;
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ag_worker_dev
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/datagov.db
      - DATABASE_URL_SYNC=sqlite:////data/datagov.db
    depends_on:
      - api
      - redis
    networks: [internal]
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -Q default,dq,metadata,notifications,exports

  # ── Celery Beat (Scheduler) ───────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ag_beat_dev
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/datagov.db
      - DATABASE_URL_SYNC=sqlite:////data/datagov.db
    depends_on:
      - worker
    networks: [internal]
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ag_redis_dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_123
    volumes:
      - redis_data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Ollama (Local LLM) ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ag_ollama_dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    restart: unless-stopped
