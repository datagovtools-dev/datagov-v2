version: "3.9"

networks:
  internal:
    driver: bridge

volumes:
  sqlite_data:
  redis_data:
  ollama_data:
  tmp_data:
  uploads_data:
  static_files:

services:
  # ── Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ag_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/var/www/static:ro
    depends_on:
      - api
      - frontend
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: ag_frontend
    expose: ["3000"]
    env_file: .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend API ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ag_api
    expose: ["8000"]
    env_file: .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:////data/datagov.db
      - DATABASE_URL_SYNC=sqlite:////data/datagov.db
    volumes:
      - ./backend:/app
      - tmp_data:/tmp
      - uploads_data:/app/uploads
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    # Seed the SQLite volume from the repo file on first start, then run a single
    # uvicorn process (SQLite allows one writer at a time)
    command: >
      sh -c "[ -f /data/datagov.db ] || cp /app/datagov.db /data/datagov.db;
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Celery Worker ─────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ag_worker
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/datagov.db
      - DATABASE_URL_SYNC=sqlite:////data/datagov.db
    volumes:
      - ./backend:/app
      - tmp_data:/tmp
      - uploads_data:/app/uploads
      - sqlite_data:/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q celery,default,dq,metadata,notifications,exports

  # ── Celery Beat (Scheduler) ───────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ag_beat
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/datagov.db
      - DATABASE_URL_SYNC=sqlite:////data/datagov.db
    volumes:
      - ./backend:/app
    depends_on:
      - worker
    networks: [internal]
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ag_redis
    expose: ["6379"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (Local LLM) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ag_ollama
    expose: ["11434"]
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    restart: unless-stopped
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
